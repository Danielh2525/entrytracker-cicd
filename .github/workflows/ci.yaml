name: EntryTracker CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: entrytracker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: entrytracker

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          git fetch --tags

          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "Latest version: $LATEST_TAG"
          echo "New version: $NEW_TAG"

          echo "image_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask application in background
        run: |
          python app.py > app.log 2>&1 &
          echo $! > flask.pid
          sleep 10

      - name: Verify application is running
        run: |
          curl -f http://127.0.0.1:5000

      - name: Stop standalone Flask application
        run: |
          kill $(cat flask.pid)

      - name: Build Docker image
        run: |
          docker build \
            -t entrytracker:${{ steps.version.outputs.image_tag }} \
            -t entrytracker:latest \
            .

      - name: Verify Docker image was created
        run: |
          docker images | grep entrytracker

      - name: Run E2E environment with Docker Compose
        run: |
          IMAGE_TAG=${{ steps.version.outputs.image_tag }}  docker compose up -d

      - name: Test E2E environment with curl
        run: |
          for i in {1..10}; do
            if curl -f http://127.0.0.1; then
              echo "E2E test passed"
              exit 0
            fi
            echo "Waiting for E2E app..."
            sleep 5
          done

          echo "E2E test failed"
          docker compose logs
          exit 1

      - name: Shut down E2E environment
        if: always()
        run: |
          IMAGE_TAG=${{ steps.version.outputs.image_tag }} docker compose down

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image for ECR
        run: |
          ECR_IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}

          docker tag entrytracker:${{ steps.version.outputs.image_tag }} $ECR_IMAGE:${{ steps.version.outputs.image_tag }}
          docker tag entrytracker:${{ steps.version.outputs.image_tag }} $ECR_IMAGE:latest

      - name: Push Docker image to ECR
        run: |
          ECR_IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}

          docker push $ECR_IMAGE:${{ steps.version.outputs.image_tag }}
          docker push $ECR_IMAGE:latest

      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/entrytracker_key
          chmod 600 ~/.ssh/entrytracker_key

          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/entrytracker_key \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "mkdir -p ${{ secrets.EC2_APP_DIR }}"

          scp -o StrictHostKeyChecking=no \
              -i ~/.ssh/entrytracker_key \
              docker-compose.prod.yaml \
              nginx.conf \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/

          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/entrytracker_key \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
                set -e

                cd ${{ secrets.EC2_APP_DIR }}

                export IMAGE_TAG="${{ steps.version.outputs.image_tag }}"

                aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
                  | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

                docker compose -f docker-compose.prod.yaml pull web

                docker compose -f docker-compose.prod.yaml up -d --force-recreate web nginx


                DEPLOY_OK=false


                for i in {1..10}; do
                  if curl -f http://localhost; then
                    echo "Deployment verification passed"
                    DEPLOY_OK=true
                    break
                  fi

                  echo "Waiting for app to become ready..."
                  docker ps
                  sleep 5
                done

                if [ "$DEPLOY_OK" = "false" ]; then
                  echo "Deployment verification failed"
                  docker compose -f docker-compose.prod.yaml logs
                  exit 1
                fi

                docker image prune -f

                echo "Deploy script finished successfully"
          EOF

      - name: Create and push Git version tag
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=${{ steps.version.outputs.image_tag }}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
